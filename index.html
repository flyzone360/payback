.bl{position:fixed;width:80vmax;height:80vmax;border-radius:50%;pointer-events:none;opacity:.55}.b1{left:-30vmax;top:-30vmax;background:radial-gradient(circle,rgba(10,132,255,.35),transparent 62%);animation:bl1 14s ease-in-out infinite alternate}.b2{right:-30vmax;bottom:-30vmax;background:radial-gradient(circle,rgba(191,90,242,.32),transparent 62%);animation:bl2 17s ease-in-out infinite alternate}

#d span{position:fixed;bottom:-30px;white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#fff;pointer-events:none;animation:rise linear infinite;will-change:transform}

.ok .c{transform:scale(.9) translateY(-14px);opacity:0}.auto .c{opacity:0}
.lk{width:70px;height:70px;animation:fl 3.2s ease-in-out infinite;filter:drop-shadow(0 8px 22px rgba(255,190,40,.45))}@keyframes fl{50%{transform:translateY(-4px)}}

.f{border-radius:16px;padding:2px;background:rgba(255,255,255,.1);transition:box-shadow .3s,background .3s}.f:focus-within{background:linear-gradient(120deg,#0a84ff,#bf5af2,#0a84ff);background-size:200% 100%;animation:gl 3s linear infinite;box-shadow:0 0 28px rgba(10,132,255,.5)}@keyframes gl{to{background-position:200% 0}}
.bad .f{background:#ff453a;box-shadow:0 0 28px rgba(255,69,58,.55)}
input{width:100%;padding:14px;border-radius:14px;border:0;background:#1c1c22;color:#fff;font-size:18px;text-align:center;outline:none;letter-spacing:.14em}
button{margin-top:14px;width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff;font-size:16px;font-weight:600;box-shadow:0 8px 24px rgba(10,132,255,.4);transition:transform .25s cubic-bezier(.34,1.7,.5,1)}button:active{transform:scale(.94,.9)}
