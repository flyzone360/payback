var CT={"Calculations Booster":"Do this first. Revise tables, squares and cubes every day for 2 weeks.","Number System":"Foundation chapter. Focus on divisibility, remainders, unit digit and factors.","HCF and LCM":"Easy marks. Learn the word-problem patterns (bells, tiles, least number).","Percentage":"Base of all arithmetic. Learn fraction to percent values by heart; everything gets faster.","Simple Interest":"Short chapter. The basic formula is enough.","Compound Interest":"Learn the 2 and 3 year shortcuts and the CI minus SI difference.","Installment":"Rarely asked. Do it once and move on.","Profit and Loss":"Use the percentage method, not long formulas. Often mixed with Discount.","Discount":"Treat it as profit and loss with a marked price. Learn successive discount.","Ratio and Proportion":"Used everywhere (Partnership, Mixture, Average). Be strong here.","Partnership":"Only 2 lectures. Profit is shared in the ratio of capital times time.","Average":"Do the mental tests. Learn the change in average and replacement tricks.","Mixture and Alligation":"The alligation cross method saves time. Practise replacement questions.","Time and Work (Pipe and Cistern)":"Use the LCM (total work) method; it solves almost everything.","Time and Distance":"Master relative speed, trains and boats. Do the mental tests.","Data Interpretation":"Speed matters. Use approximation instead of exact division.","Algebra":"Long chapter (25 lectures) with repeating patterns. Keep a formula sheet.","Equations":"Practise quick substitution and do the mental test.","AP, GP, HP":"Short. Learn nth term and sum formulas.","Surds and Indices":"Learn the rules once, then practise simplification.","Simplification":"Pure speed. Practise BODMAS, fractions and approximation daily.","Plane Geometry":"Biggest Maths chapter (36 lectures). Understand theorems with figures, do not mug up. Practise daily.","Mass Point Geometry":"One lecture. A handy shortcut for ratios in triangles.","Mensuration 2D":"Learn all area and perimeter formulas and revise weekly.","Mensuration 3D":"Formulas plus melting and recasting questions.","Trigonometry":"Memorise standard values and identities first. High scoring once strong.","Height and Distance":"Depends on trigonometry values. Draw the figure every time.","Coordinate Geometry":"Learn distance, section and area formulas, then do the exercises.","Statistics":"Short. Mean, median, mode and basic ideas.","Permutation and Combination":"Learn nPr and nCr and when to use each.","Probability":"Think favourable over total. Easy if P and C is clear.","New Concepts by Eduquity":"Low priority. Watch after the main chapters.",
"Counting Figures":"Count systematically, row by row, to avoid misses.","Blood Relation":"Always draw a family tree and mark gender.","Directions and Distance":"Draw the path with compass directions; use Pythagoras for the final distance.","Non-Verbal":"Needs daily practice. Learn rotation, mirror and water image, and embedded figures.","Coding Decoding":"Write A=1 to Z=26 once and keep it near you.","Letter Series":"Check jumps and alternating patterns.","Alphabetical Series":"Write the alphabet with positions and test patterns.","Inequality":"Learn the coded symbol rules. Fast scoring.","Arithmetic Reasoning":"A mix of age and basic maths. Go slowly at first.","Number Series":"Check differences, squares, cubes and multiplication.","Calendar":"Learn the odd days concept and solve with weekday tricks.","Clock":"Angle = 30H minus 5.5M. Practise mirror and faulty clock questions.","Ranking":"Total = left rank + right rank minus 1. Draw a line.","Syllogism":"Use Venn diagrams and learn the conclusion rules.","Dice":"Learn opposite faces and the common-face rule.","Sitting Arrangements":"Draw the shape first and place sure information first.","Puzzle":"Use a table and start with the most definite clue.","Machine Input":"Find the rule from step 1 and step 2 only.","Cube and Cuboid":"Learn the 3, 2, 1, 0 painted faces rule.","Venn Diagram":"Match sets with shapes. Easy marks.","Analytical Reasoning":"Long topic with many formats. Take it slowly.","Matrix":"Check row, column and diagonal patterns.","Missing Number":"Find the pattern across rows or columns.",
"Tense":"Learn the 12 tense structures; most error-spotting depends on them.","Modals":"Learn each modal with its meaning and examples.","Preposition":"Learn by fixed phrases, not rules. Keep a list of pairs.","Article":"Learn a, an, the rules and the common exceptions.","Narration":"Learn reporting verb rules and tense changes.","Voice":"Practise converting every tense both ways.","Cloze Test":"Read the whole passage first and use grammar clues.","Parajumbles":"Find the opening sentence, then link pairs using pronouns and connectors.","Unseen Passage":"Read the questions first, then scan the passage.","Vocab Class":"Learn 10 words a day and revise them. Keep a notebook.","One Word Substitutions":"Learn roots such as cide, phobia and cracy.","Idioms and Phrases":"Learn each with a sentence, not alone.","Noun":"Basics matter. Take time over countable and uncountable nouns.","Pronoun":"Practise agreement and case. Frequently asked.","Determiners":"Focus on some, any, few, little and each, every.","Adjective":"Learn degrees of comparison and order of adjectives.","Adverb":"Learn placement and common confusions.","Verb":"Subject-verb agreement is the key scoring area.","Conjunction":"Learn paired conjunctions like neither/nor.","Question Tag":"Small topic with fixed rules. Easy marks.",
"Independent States of Medieval India":"Long section. Make a table of dynasty, founder, capital and key facts.","Gupta Empire":"Learn rulers, Chinese travellers and art together.","Rivers of India":"Make a table: origin, tributaries, mouth, major cities.","Border of India":"Learn which states touch which countries.","Fundamental Rights":"Know Articles 12 to 35 and the 5 writs.","Emergency Provisions":"Know Articles 352, 356 and 360 and who declares them.","Finance Commission":"Know Article 280 and the commissions with their chairpersons.","Demography":"Learn census facts and sex ratio and literacy leaders.","Electricity":"Learn Ohm's law, series versus parallel, and the units.","Optics":"Memorise the lens and mirror sign conventions.","Periodic Table":"Learn groups, periods and trends.","Vitamins":"Make a table of vitamin, source and deficiency disease.","Blood":"Learn blood groups and blood components.","National Parks":"Learn park, state and animal in one table.","Sports":"Revise trophies, venues and recent winners.","Important Days":"Make a month-wise date list."};
var so=false,tip=false,TIPS={real:["Pick one source per subject and finish it. Resource hopping is the most common beginner mistake.","Solve previous year papers from the last 4 to 5 years. They show the real pattern better than anything else.","Accuracy first, speed later. Spend the first 2 months on accuracy, then add timing.","Start with sectional tests, then move to full mocks. Analyse every mock, since analysis teaches more than the test.","Do not leave English for the end. Read daily and revise vocabulary daily.","For GK, make short notes and revise them many times. Do current affairs for the last 6 months near the exam.","Fix a study time and phone-free hours. Take one rest day a week to avoid burnout.","Tier 2 needs strong Maths and English, and this Maths batch covers it, so keep your basics solid now."],
road:["Daily rule: watch 1 lecture, then solve practice on the same day. Watching alone feels like progress but does not give marks.","Start with 3 lectures a day (one Maths or Reasoning, one English or GK, plus practice). Raise it slowly once it feels easy.","Mark a lecture Done only after you have solved its practice questions. Honest ticks give an honest progress bar.","Keep an error notebook. Write every question you got wrong, why, and the correct method. Re-read it every Sunday.","Revise on day 1, day 7 and day 30 after finishing a topic. Use one weekly slot only for revision, no new lectures.","After about 2 months start sectional tests, then full mocks every week. Analyse each mock for at least as long as you took to attempt it.","Consistency beats intensity. 3 hours every day is better than 10 hours once a week. Sleep 7 hours.","Do not jump between courses or teachers. You already have enough material, so finish it."],
exam:["SSC CGL Tier 1 usually has 100 questions in 60 minutes: Reasoning 25, General Awareness 25, Quantitative Aptitude 25, English 25.","Each correct answer gives 2 marks and each wrong answer takes away 0.5, so guessing blindly hurts.","Maths and Reasoning are scoring and need practice. English and GK reward daily small revision.","Patterns and cut-offs change, so always confirm the latest notice on ssc.gov.in."],
mist:["Collecting more notes and videos instead of finishing what you have.","Skipping revision. Forgetting is normal, so schedule it.","Ignoring weak topics. Spend extra time on what you score lowest in.","Studying without a timer. Practise under time pressure from the start."],
first:["Days 1 to 3: finish the Maths Calculations Booster and start Number System. Learn tables, squares and cubes.","Week 1: one Maths, one Reasoning and one English lecture a day. Keep it light and build the habit.","Week 2: add GK (Static GK or Polity) and start a vocabulary notebook.","Week 3: add a revision hour every Sunday and an error notebook.","Week 4: take your first sectional test and note your weak topics.","Goal for the month: no missed days. Speed comes later."],daily:["Morning, 90 min: Maths or Reasoning lecture, then solve practice.","Afternoon, 60 min: English (grammar plus 10 vocab words).","Evening, 90 min: GK or Science lecture, then 15 min of notes.","Night, 20 min: revise the day notes and update the error notebook.","Change the timings to fit your day. The order matters more than the clock."],method:["1. Look at the topic name and think what you already know (1 min).","2. Watch with a notebook and write only formulas and tricks.","3. Pause and try the example before the teacher solves it.","4. Right after the lecture, solve 10 to 15 questions without help.","5. Mark it Done, revise the notes the next day and again after a week."],week:["Monday to Friday: new lectures plus practice.","Saturday: finish pending lectures and take a sectional test.","Sunday: revise the week, analyse mistakes, and rest in the evening."],phy:["Learn formulas and SI units together. Many SSC questions are direct formula or unit based.","Revise Electricity and Optics often, since they are asked a lot.","Make one-line notes: law, scientist, unit, example.","Solve 10 previous year questions after each topic."],chem:["Memorise the periodic table trends and the first 20 elements.","Acids, bases, salts and carbon compounds are high frequency. Keep a table of common names and uses.","Learn common chemical names and formulas (baking soda, bleaching powder, plaster of Paris).","Learn each reaction type with one example."],bio:["Biology is mostly facts. Make tables for vitamins with deficiency diseases, and blood groups.","Human body systems (circulation, digestion, excretion, nervous) are asked every year.","Learn organs and their functions in small groups.","Revise with diagrams and previous year questions."],sgk:["Static GK is revision heavy. Make short notes by topic and revise weekly.","Awards, Sports, Organisations and First in India link with current affairs, so update them regularly.","Use tables: place, state, river, park, founder.","Do the Top 30 Questions class twice."],math:["Learn tables up to 20, squares up to 30, cubes up to 15, and fraction to percentage values (1/7 = 14.28%, 1/9 = 11.11%). This is the Calculations Booster, so do it first and revise it daily.","Suggested order: Calculations, Number System, HCF/LCM, Percentage, Ratio, Profit and Loss, Discount, Average, Time and Work, Time and Distance, then Algebra and the geometry chapters.","Videos marked Optional or extra practice can wait until your first pass is done. Videos marked Must do or Latest Update should not be skipped.","Do the Mental Tests with a timer. They build the speed you need in the exam.","Geometry, Mensuration and Trigonometry are the longest chapters (36, 33 and 19 lectures). Do a few questions daily instead of rushing them.","Keep one formula notebook and add to it after every chapter.","Chapters like Mass Point, AP/GP/HP and New Concepts by Eduquity are lower priority at the start."],
reas:["Practise 30 to 40 minutes daily. Reasoning improves only through repetition.","Blood Relation and Sitting Arrangement: always draw the diagram, never solve in your head.","Coding-Decoding, Series and Analogy: learn the common patterns (letter positions, opposites, skip patterns).","Non-Verbal needs the most practice. Do a small set every day.","Treat the PYQ Practice classes seriously, because they show the real exam pattern.","Aim for about 30 seconds per question once you are comfortable."],
hist:["Make timeline tables: ruler, year, battle, important facts. Tables are easier to revise than long notes.","Medieval dynasties are many, so revise Slave, Khilji and Tughlaq together.","Link events to places on a map.","Solve previous year questions after each topic, because SSC repeats facts."],
geo:["Keep an atlas or map open. Locate rivers, mountains, passes and borders as you study.","Rivers of India has 9 lectures, so make a list: origin, tributaries, where it ends, major cities.","Remember physical geography as cause and effect (winds, cyclones, ocean currents).","Link geography with current news such as floods, earthquakes and cyclones."],
pol:["Learn article numbers: Fundamental Rights (12-35), DPSP (36-51), Fundamental Duties (51A), Emergency (352, 356, 360).","Fundamental Rights is the biggest topic (about 40 lectures), so make one summary table.","Know the constitutional development acts (1773 to 1950) in order with their key features.","Revise Union, Governor and High Court topics using PYQs."],
eco:["First understand the concepts (demand, supply, money, inflation). Memorising without understanding fails.","Banking, RBI, Budget and Monetary Policy link directly to current affairs, so read monthly updates.","Learn full forms and key terms (CRR, SLR, repo rate, GDP, GNP).","Make one-page notes for Finance Commission, Planning and Taxes."],
eng:["Learn 10 new words daily and revise them. Use the Vocab classes as flashcards.","Read one newspaper editorial for 15 minutes every day.","After each grammar topic (Tense, Modals, Preposition and so on) solve its practice set immediately.","Idioms and One Word Substitutions: learn 10 a day and revise weekly.","Practise Cloze Test and Para-jumbles daily. Both can be scored with practice.","Reading comprehension: read the questions first, then the passage."]};
